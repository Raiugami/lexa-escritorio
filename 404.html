<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Honra</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%;background:#151515}</style>
<script>
/* GitHub Pages só conhece o index.html. Um endereço como /clientes chega aqui:
   mandamos para o app, que mostra a tela certa e deixa a barra limpa de novo. */
(function(){var p=location.pathname.replace(/^\/+|\/+$/g,'');
  var ok=/^[a-z][a-z0-9-]*$/.test(p);
  location.replace('/'+location.search+(ok?'#'+p:''));})();
</script></head><body></body></html>
