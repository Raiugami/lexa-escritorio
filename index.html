<!doctype html>
<html lang="pt-BR" class="tema-neutro">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Honra · Gestão para advogados</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: moldura cinza com dois painéis arredondados (menu lateral recolhível só com ícones + área de trabalho em mosaico de cartões); no celular o menu vira barra inferior. */
:root{
  --bg:#e8ebe9; --panel:#f6f7f6; --surface:#ffffff; --surface-2:#eef1ef; --line:#e3e8e5;
  --fg:#111813; --muted:#47514b; --field:#c3ccc6; --accent:#1f6b45; --accent-ink:#1d5c3d; --accent-fg:#ffffff; --accent-soft:#e3efe7;
  --grad:linear-gradient(135deg,#0e3a25 0%,#1f6b45 55%,#3a9a66 100%);
  --grad-dark:radial-gradient(120% 140% at 100% 0%,#2f8a5c 0%,#0e3a25 55%,#071f14 100%);
  --on-grad-muted:#d4ecdd; --hatch:#cfd8d2; --bar:#6fbf8e;
  --ok:#1d5c3d; --ok-soft:#e3efe7; --warn:#74510a; --warn-soft:#fcefd2; --bad:#a3342a; --bad-soft:#fbe1de; --info:#2a3f73; --info-soft:#e1e7f5; --due:#7a4507; --due-soft:#fde7cf;
  --shadow:0 1px 2px rgba(21,32,26,.07);
  --f-display:"Plus Jakarta Sans", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body:"Plus Jakarta Sans", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --panel:#0b0b0b; --surface:#151515; --surface-2:#1e1e1e; --line:#2a2a2a;
  --fg:#ededed; --muted:#a8a8a8; --field:#3a3a3a; --accent:#5fbf8a; --accent-ink:#8fd9ae; --accent-fg:#06140c; --accent-soft:#16291f;
  --grad:linear-gradient(135deg,#0f4a2e 0%,#1f7a4c 55%,#45b077 100%);
  --grad-dark:radial-gradient(120% 140% at 100% 0%,#2a7a52 0%,#0d2e1e 55%,#06120c 100%);
  --on-grad-muted:#cfe9da; --hatch:#3a3a3a; --bar:#3f8f63;
  --ok:#8fd9ae; --ok-soft:#1f3328; --warn:#f0c66b; --warn-soft:#3a2f17; --bad:#ff9a8f; --bad-soft:#3d1f1c; --info:#a9c4ff; --info-soft:#1d2a40; --due:#f5b979; --due-soft:#3a2a17;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#0b0b0b; --surface:#151515; --surface-2:#1e1e1e; --line:#2a2a2a;
  --fg:#ededed; --muted:#a8a8a8; --field:#3a3a3a; --accent:#5fbf8a; --accent-ink:#8fd9ae; --accent-fg:#06140c; --accent-soft:#16291f;
  --grad:linear-gradient(135deg,#0f4a2e 0%,#1f7a4c 55%,#45b077 100%);
  --grad-dark:radial-gradient(120% 140% at 100% 0%,#2a7a52 0%,#0d2e1e 55%,#06120c 100%);
  --on-grad-muted:#cfe9da; --hatch:#3a3a3a; --bar:#3f8f63;
  --ok:#8fd9ae; --ok-soft:#1f3328; --warn:#f0c66b; --warn-soft:#3a2f17; --bad:#ff9a8f; --bad-soft:#3d1f1c; --info:#a9c4ff; --info-soft:#1d2a40; --due:#f5b979; --due-soft:#3a2a17;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}
/* Identidade neutra (padrão): fundo areia, cartões marfim, destaque em preto */
html.tema-neutro{
  --bg:#ebe8e0; --panel:#f4f2ed; --surface:#fcfbf8; --surface-2:#efece5; --line:#dcd7cd;
  --fg:#151515; --muted:#5f5b54; --field:#cdc7bb; --accent:#151515; --accent-ink:#151515; --accent-fg:#ffffff; --accent-soft:#e6e2d9;
  --grad:linear-gradient(135deg,#0c0c0c 0%,#151515 55%,#2b2a27 100%);
  --grad-dark:radial-gradient(120% 140% at 100% 0%,#3a3834 0%,#1a1918 55%,#0c0c0b 100%);
  --on-grad-muted:#d6d1c7; --hatch:#d3cdc1; --bar:#5f5b54;
  --shadow:0 1px 2px rgba(40,34,24,.07);
  --side-bg:#ebe8e0; --side-fg:#2a2825; --side-muted:#6f6a61; --side-hover:rgba(21,21,21,.06); --ind:#151515; --ind-fg:#ffffff}
@media (prefers-color-scheme: dark){html.tema-neutro:not([data-theme="light"]){
  --bg:#000000; --panel:#0b0b0b; --surface:#151515; --surface-2:#1e1e1e; --line:#2a2a2a;
  --fg:#ededed; --muted:#a9a49b; --field:#3a3a3a; --accent:#ededed; --accent-ink:#f4f2ed; --accent-fg:#151515; --accent-soft:#242321;
  --grad:linear-gradient(135deg,#262523 0%,#33312e 55%,#4a4743 100%);
  --grad-dark:radial-gradient(120% 140% at 100% 0%,#3a3834 0%,#171615 55%,#0a0a0a 100%);
  --on-grad-muted:#cfcac0; --hatch:#3a3835; --bar:#8a857b;
  --side-bg:#151515; --side-fg:#e4e1da; --side-muted:#8f8a81; --side-hover:rgba(255,255,255,.07); --ind:#ededed; --ind-fg:#151515}}
html.tema-neutro[data-theme="dark"]{
  --bg:#000000; --panel:#0b0b0b; --surface:#151515; --surface-2:#1e1e1e; --line:#2a2a2a;
  --fg:#ededed; --muted:#a9a49b; --field:#3a3a3a; --accent:#ededed; --accent-ink:#f4f2ed; --accent-fg:#151515; --accent-soft:#242321;
  --grad:linear-gradient(135deg,#262523 0%,#33312e 55%,#4a4743 100%);
  --grad-dark:radial-gradient(120% 140% at 100% 0%,#3a3834 0%,#171615 55%,#0a0a0a 100%);
  --on-grad-muted:#cfcac0; --hatch:#3a3835; --bar:#8a857b;
  --side-bg:#151515; --side-fg:#e4e1da; --side-muted:#8f8a81; --side-hover:rgba(255,255,255,.07); --ind:#ededed; --ind-fg:#151515}
@media (min-width:761px){
  html.tema-neutro .side{background:var(--side-bg);color:var(--side-fg)}
  html.tema-neutro .nav .grp{color:var(--side-muted)}
  html.tema-neutro .nav .fold-btn:hover{color:var(--side-fg)}
  html.tema-neutro .nav a{color:var(--side-fg);margin-left:12px}
  html.tema-neutro .nav a:hover{background:var(--side-hover);color:var(--side-fg)}
  html.tema-neutro .nav a.on,html.tema-neutro .nav a.on svg{color:var(--ind-fg)}
  html.tema-neutro .nav a.on{margin-right:12px;border-radius:14px}
  html.tema-neutro .nav-ind{background:var(--ind);border-radius:14px;margin-right:12px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  html.tema-neutro .nav-ind::before,html.tema-neutro .nav-ind::after{display:none}
  html.tema-neutro .nav .cnt{background:var(--ind);color:var(--ind-fg)}
  html.tema-neutro .nav a.on .cnt{background:var(--ind-fg);color:var(--ind)}
  html.tema-neutro .side-btn{color:var(--side-fg)}
  html.tema-neutro .side-btn:hover{background:var(--side-hover);color:var(--side-fg)}
  html.tema-neutro .side .logo{background:var(--ind);color:var(--ind-fg)}
  html.tema-neutro .side .logo.img{background:transparent}
  html.tema-neutro .chave{background:rgba(0,0,0,.15)}
  html.tema-neutro .tema[aria-checked="true"] .chave{background:rgba(0,0,0,.45)}
}
@media (prefers-color-scheme: dark){html.tema-neutro:not([data-theme="light"]) .btn.pri,html.tema-neutro:not([data-theme="light"]) .fab{background:#ededed;color:#151515;border-color:#ededed}}
html.tema-neutro[data-theme="dark"] .btn.pri,html.tema-neutro[data-theme="dark"] .fab{background:#ededed;color:#151515;border-color:#ededed}
html.tema-neutro .side .logo-honra{background:var(--ind)}
html.tema-neutro .side .logo-honra svg{color:var(--ind-fg)}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em} h2{font-size:1rem} h3{font-size:.95rem}
a{color:var(--accent-ink)}
.app{display:flex;gap:16px;min-height:100vh;padding-block:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.side{flex:0 0 232px;background:var(--panel);border-radius:24px;padding:20px 12px;position:sticky;top:16px;height:calc(100vh - 32px);overflow-y:auto;display:flex;flex-direction:column;gap:4px;transition:flex-basis .32s cubic-bezier(.3,.8,.2,1)}
.brand{display:flex;align-items:center;gap:10px;height:44px;padding:0 6px;margin-bottom:8px}
.logo-honra svg{width:88%;height:88%;color:#fff}
.side .logo-honra{background:var(--grad);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.logo{flex:0 0 36px;height:36px;border-radius:12px;background:var(--grad);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.brand b{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav .grp{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 12px 2px}
.nav a{position:relative;color:var(--fg);text-decoration:none;min-height:38px;padding:0 12px;border-radius:14px;display:flex;gap:12px;align-items:center;font-weight:500}
.nav a svg{flex:0 0 20px}
.nav a .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:var(--shadow)}
.nav a.on svg{color:var(--accent)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:10px;width:4px;height:24px;border-radius:0 4px 4px 0;background:var(--accent)}
.nav .cnt{font-size:.7rem;background:var(--fg);color:var(--bg);border-radius:8px;padding:1px 7px;font-weight:700;font-variant-numeric:tabular-nums}
.nav .dot{display:none;position:absolute;top:9px;left:30px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--panel)}
.side-foot{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.side-foot .side-btn{min-height:40px}
/* barras de rolagem discretas; no menu só aparecem ao passar o mouse */
html{scrollbar-width:thin;scrollbar-color:var(--field) transparent}
.side,.mais{scrollbar-width:thin;scrollbar-color:transparent transparent;scrollbar-gutter:stable}
.side:hover,.side:focus-within,.mais:hover{scrollbar-color:var(--field) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--field);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-button{display:none}
input[type=checkbox]{accent-color:var(--accent)}
::placeholder{color:var(--muted);opacity:.8}
label.chk{flex-direction:row;align-items:center;gap:10px;font-size:.88rem;color:var(--fg)}
.side-btn{font:inherit;color:var(--muted);background:transparent;border:0;min-height:44px;padding:0 12px;border-radius:14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left}
.side-btn:hover{background:var(--surface-2);color:var(--fg)}
.side-btn svg{flex:0 0 20px}
.app.mini .side{flex-basis:72px}
.app.mini .brand b,.app.mini .nav .grp,.app.mini .nav .lbl,.app.mini .nav .cnt,.app.mini .side-btn .lbl{display:none}
.app.mini .nav .dot{display:block}
.app.mini .nav a,.app.mini .side-btn{justify-content:center;padding:0}
.app.mini .rot{transform:scaleX(-1)}
.main{flex:1;min-width:0;background:var(--panel);border-radius:24px;padding:24px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.nav-ind{display:none}
.top{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:-8px 0 6px}
.top .brand-top,.top .so-mob{display:none}
.conta{position:relative}
.conta-btn{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 4px;min-height:44px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:var(--shadow);max-width:280px}
.conta-btn:hover{border-color:var(--field)}
.conta-av{flex:0 0 36px;width:36px;height:36px}
.conta-txt{display:flex;flex-direction:column;line-height:1.2;text-align:left;min-width:0}
.conta-txt b,.conta-cab b{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conta-txt small,.conta-cab small{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.conta-seta{flex:0 0 16px;color:var(--muted);transition:transform .2s}
.conta-btn[aria-expanded="true"] .conta-seta{transform:rotate(180deg)}
.conta-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);width:270px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:8px;z-index:60}
.conta-menu.aberto{display:block}
.conta-cab{display:flex;gap:10px;align-items:center;padding:8px 8px 10px}
.conta-nuvem{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.cn-status{display:flex;gap:10px;align-items:flex-start;padding:8px 10px}
.cn-status b{display:block;font-size:.82rem}.cn-status small{display:block;font-size:.74rem;color:var(--muted)}
.cn-ponto{flex:0 0 8px;height:8px;border-radius:50%;background:var(--ok);margin-top:6px;box-shadow:0 0 0 3px var(--ok-soft)}
.conta-item.sair{color:var(--bad)}
.conta-menu a,.conta-item{font:inherit;width:100%;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 10px;border-radius:12px;color:var(--fg);text-decoration:none;background:transparent;border:0;cursor:pointer;font-weight:600;text-align:left}
.conta-menu a:hover,.conta-item:hover,.conta-menu a.on{background:var(--accent-soft);color:var(--accent-ink)}
.conta-menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.conta-menu .chave{background:var(--field)}
.conta-menu .tema[aria-checked="true"] .chave{background:var(--accent)}
.phead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.phead p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:700;border:1.5px solid var(--accent);background:transparent;color:var(--accent-ink);min-height:44px;padding:0 20px;border-radius:99px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--grad);background-origin:border-box;border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:32px;padding:0 12px;font-size:.8rem}
.btn.ghost{border-color:transparent}
.btn.soft{background:var(--surface-2);border-color:transparent;color:var(--fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border-radius:var(--r);padding:20px;min-width:0}
.panel>h2,.panel>h3{margin-bottom:12px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lb{font-weight:600;font-size:.9rem}
.kpi .v{font-size:1.85rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.78rem;color:var(--muted)}
.kpi.bad .v,.kpi.bad .s{color:var(--bad)} .kpi.ok .v{color:var(--ok)}
.kpi.hero{background:var(--grad);color:#fff}
.kpi.hero .s{color:var(--on-grad-muted)} .kpi.hero .v{color:#fff}
.dark-card{background:var(--grad-dark);color:#fff;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px}
.dark-card .s{color:var(--on-grad-muted);font-size:.85rem}
.dark-card .btn{background:#fff;color:#0e3a25;border-color:#fff}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.flexr{display:flex;flex-wrap:wrap;gap:14px}
.flexr>*{min-width:0}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.75rem;color:var(--muted);text-align:left;padding:8px 10px;font-weight:600;white-space:nowrap}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.p-pago{background:var(--ok-soft);color:var(--ok)} .p-atrasado{background:var(--bad-soft);color:var(--bad)}
.p-parcial{background:var(--warn-soft);color:var(--warn)} .p-pendente{background:var(--surface-2);color:var(--muted)}
.p-info{background:var(--info-soft);color:var(--info)} .p-acc{background:var(--accent-soft);color:var(--accent-ink)} .p-due{background:var(--due-soft);color:var(--due)}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
form .fs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}

.aviso-parada{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 12px;border-radius:12px;background:rgba(255,120,100,.18);color:#ffd9d2;font-size:.85rem;font-weight:600}

.li.feito .t{text-decoration:line-through;opacity:.6}
.tag-prazo{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--due-soft);color:var(--due);vertical-align:2px}
.seg{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--surface-2);width:max-content;max-width:100%}
.seg-op{flex-direction:row;cursor:pointer}
.seg-op input{position:absolute;opacity:0;pointer-events:none}
.seg-op span{padding:7px 16px;border-radius:99px;font-weight:700;font-size:.85rem;color:var(--muted);transition:background .2s,color .2s}
.seg-op input:checked+span{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg-op input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.cmp{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.cmp.up{color:#bdf0cf}.cmp.down{color:#ffc9c0}
form.fs{display:grid;grid-template-columns:minmax(0,1fr);gap:14px 14px;align-items:start}
form.fs>.row:last-child{grid-column:1/-1;margin-top:8px;gap:10px;flex-wrap:wrap}
.modal>.note{margin:-4px 0 2px}
.fs .c2{grid-column:span 2} .fs .c4{grid-column:1/-1}
.sect{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;margin:18px 0 4px;grid-column:1/-1}
label{display:flex;flex-direction:column;gap:6px;font-size:.84rem;font-weight:600;color:var(--fg);min-width:0}
input,select,textarea{font:inherit;font-size:15px;font-weight:500;color:var(--fg);background:var(--surface);border:1.5px solid var(--field);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:0;background:var(--surface)}
input[readonly]{opacity:.8}
textarea{min-height:70px;resize:vertical}
.chips,.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg{background:var(--surface-2);border-radius:99px;padding:4px;align-self:flex-start}
.chip{border:0;background:transparent;border-radius:99px;min-height:36px;padding:0 14px;cursor:pointer;font:inherit;font-weight:600;font-size:.85rem;color:var(--muted)}
.chip.on{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:var(--shadow)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);border-radius:99px;padding:4px;align-self:flex-start;max-width:100%;overflow-x:auto}

/* ===== Movimento ===== */
@keyframes sobe{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes arco{from{stroke-dasharray:0 400}}
@keyframes surge{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes cai{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.anim{animation:sobe .5s cubic-bezier(.2,.8,.2,1) backwards}
.bars>div.cresce{transform-origin:bottom;animation:cresce .6s cubic-bezier(.2,.8,.2,1) backwards}
.arco{animation:arco 1.1s .25s cubic-bezier(.3,.7,.2,1) both}
.modal-bg{animation:surge .2s ease both}
.modal{animation:pop .28s cubic-bezier(.2,.8,.2,1) backwards}
.conta-menu.aberto{animation:cai .18s ease both;transform-origin:top right}
.toast{animation:toastIn .3s cubic-bezier(.2,.8,.2,1) both}
.kpi,.day,.panel,.dark-card,.btn,.conta-btn{transition:transform .2s ease,box-shadow .2s ease,background-color .2s,border-color .2s,filter .2s}
.kpi:hover,.day:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
.btn:active,.conta-btn:active,.day:active{transform:scale(.97)}
.nav a svg{transition:transform .2s ease}
.nav a:hover svg{transform:translateX(2px)}
@keyframes daEsquerda{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes pulo{0%{transform:none}35%{transform:translateY(-4px) scale(1.15)}60%{transform:translateY(1px) scale(.95)}100%{transform:none}}
.entra-nav{animation:daEsquerda .45s cubic-bezier(.2,.8,.2,1) backwards}
.nav a svg.pulo{animation:pulo .5s .12s ease}
.nav a{transition:color .25s,background-color .2s,transform .2s ease}
.nav a:not(.on):hover{transform:translateX(3px)}
.nav a:hover svg{transform:none}
.app.some-txt .nav .lbl,.app.some-txt .nav .grp,.app.some-txt .nav .cnt,.app.some-txt .brand b,.app.some-txt .brand .logo-full,.app.some-txt .mk-nome{opacity:0;transition:opacity .14s}
.app.mostra-txt .nav .lbl,.app.mostra-txt .nav .grp,.app.mostra-txt .nav .cnt,.app.mostra-txt .brand b,.app.mostra-txt .brand .logo-full,.app.mostra-txt .mk-nome{animation:surge .3s .2s backwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
/* ===================== Utilidades ===================== */
const AREAS={civel:['Cível','#2d5e8a'],criminal:['Criminal','#b3261e'],previdenciario:['Previdenciário','#2f7a4f'],trabalhista:['Trabalhista','#c26a12'],ambiental:['Ambiental','#178a8a'],administrativo:['Administrativo','#6b4aa0'],execucao:['Execução penal','#4a4440'],familia:['Família','#a0476b'],tributario:['Tributário','#7a6a1f'],consumidor:['Consumidor','#3f7f2a']};
const UFS='AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
const CIVIL=['Solteiro(a)','Casado(a)','Divorciado(a)','Viúvo(a)','União estável'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const m=c=>`<span class="money">${brl(c)}</span>`;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje=()=>iso(new Date());
const br=s=>s?s.split('-').reverse().join('/'):'—';
const parseISO=s=>{const[y,mo,d]=s.split('-').map(Number);return new Date(y,mo-1,d)};
function addMeses(s,k){const[y,mo,d]=s.split('-').map(Number);const t=new Date(y,mo-1+k,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return iso(t)}
const ym=s=>s.slice(0,7);
const centsFrom=str=>{const d=String(str||'').replace(/\D/g,'');return d?parseInt(d,10):0};
const fmtCents=c=>(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pctFrom=str=>{const v=parseFloat(String(str||'').replace(',','.'));return isNaN(v)?0:v};
const onlyDigits=s=>String(s||'').replace(/\D/g,'');
function fmtCPF(s){const d=onlyDigits(s);if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');return s||''}
function fmtTel(s){const d=onlyDigits(s);if(d.length===11)return d.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3');if(d.length===10)return d.replace(/(\d{2})(\d{4})(\d{4})/,'($1) $2-$3');return s||''}
function cpfValido(s){const d=onlyDigits(s);if(d.length!==11||/^(\d)\1+$/.test(d))return false;for(const t of[9,10]){let sum=0;for(let i=0;i<t;i++)sum+=+d[i]*(t+1-i);let r=(sum*10)%11;if(r===10)r=0;if(r!==+d[t])return false}return true}
function extenso(c){ // valor por extenso (reais e centavos)
  const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const dz=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const cn=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const tri=n=>{if(n===0)return'';if(n===100)return'cem';const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(cn[c]);if(r<20){if(r)p.push(u[r])}else{p.push(dz[Math.floor(r/10)]+(r%10?' e '+u[r%10]:''))}return p.join(' e ')};
  const num=n=>{if(n===0)return'zero';const parts=[];const mi=Math.floor(n/1e6),mil=Math.floor((n%1e6)/1000),r=n%1000;
    if(mi)parts.push(mi===1?'um milhão':tri(mi)+' milhões');if(mil)parts.push(mil===1?'mil':tri(mil)+' mil');if(r)parts.push(tri(r));
    if(parts.length<2)return parts.join('');const ult=parts.pop();return parts.join(' ')+((r&&(r<100||r%100===0))||(!r&&mil&&(mil<100||mil%100===0))?' e ':' ')+ult};
  const re=Math.floor(c/100),ce=c%100;let s='';
  if(re)s=num(re)+(re===1?' real':(re%1e6===0?' de reais':' reais'));
  if(ce)s+=(s?' e ':'')+num(ce)+(ce===1?' centavo':' centavos');
  return s||'zero reais';
}

/* ===================== Dados ===================== */
const KEY='lexa-escritorio-v1';
let S;
function vazio(){return{perfil:{nome:'',oab:'',cpf:'',rg:'',nac:'brasileiro(a)',civil:'',tel:'',email:'',end:'',cidade:'',pix:''},clientes:[],parcelas:[],agenda:[],acoes:[],avulsos:[],empresas:[],devedores:[],acordos:[],seq:1,exemplo:false,marca:null}}
function salvar(){salvarLocal();nuvemAgenda()}
function carregar(){try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(vazio(),JSON.parse(r));return}}catch(e){}S=exemplo()}
const nid=()=>{let v=Date.now()*1000+Math.floor(Math.random()*1000);if(v<=(S.seq||0))v=S.seq+1;S.seq=v+1;return v};

function gerarParcelasCliente(c){
  S.parcelas=S.parcelas.filter(p=>p.clienteId!==c.id||(p.pagamentos&&p.pagamentos.length));
  if(c.tipoHon!=='fixo')return;
  const ja=S.parcelas.filter(p=>p.clienteId===c.id);
  if(ja.length)return; // não reescreve parcelas com pagamentos
  if(c.entrada>0)S.parcelas.push({id:nid(),clienteId:c.id,num:0,venc:c.criado,valor:c.entrada,pagamentos:[{valor:c.entrada,data:c.criado}],obs:'Entrada'});

const EXEMPLO_MARCA={nome:'Francisco Bernuzzi',cor:'#c9a85a',logo:'https://franciscobernuzzi.com.br/img/logo.webp',icone:'https://franciscobernuzzi.com.br/img/monograma.webp',fundo:'escuro',mostraNome:false};
ROUTES.aparencia=()=>{const mk=rascMarca||(rascMarca=marca());
  const prev=src=>src?`<img src="${esc(src)}" alt="" class="up-prev">`:'<span class="up-prev vazio">sem imagem</span>';
  return `<div class="phead"><div><h1>Aparência</h1><p>Deixe o sistema com a cara do seu escritório. As mudanças aparecem na hora; salve para manter.</p></div>
  <div class="row"><button class="btn" data-act="marca-exemplo" type="button">Testar com exemplo</button><button class="btn" data-act="marca-padrao" type="button">Voltar ao padrão</button><button class="btn pri" data-act="marca-salvar" type="button">Salvar aparência</button></div></div>

  <section class="panel" style="flex:1 1 320px"><h2>Escritório</h2>

    <div class="swatches" role="radiogroup" aria-label="Cores prontas">${CORES.map(([n,c])=>`<button type="button" class="sw ${c===mk.cor.toLowerCase()?'on':''}" style="background:${c}" data-cor="${c}" role="radio" aria-checked="${c===mk.cor.toLowerCase()}" aria-label="${n}" title="${n}"></button>`).join('')}</div>

  </section>
  <section class="panel" style="flex:1 1 320px"><h2>Logo</h2><p class="note">PNG, SVG ou WebP. O logo completo aparece com o menu aberto; o ícone (um monograma, por exemplo) aparece com o menu recolhido.</p>
    <div class="up"><div><b>Logo completo</b>${prev(mk.logo)}</div><div class="row"><label class="btn sm">Enviar arquivo<input type="file" accept="image/*" data-up="logo" hidden></label>${mk.logo?'<button class="btn sm" data-act="marca-tira" data-k="logo" type="button">Remover</button>':''}</div>

    <div class="up"><div><b>Ícone</b>${prev(mk.icone)}</div><div class="row"><label class="btn sm">Enviar arquivo<input type="file" accept="image/*" data-up="icone" hidden></label>${mk.icone?'<button class="btn sm" data-act="marca-tira" data-k="icone" type="button">Remover</button>':''}</div>
      <label>ou endereço da imagem<input id="mk_icone" value="${esc(/^data:/.test(mk.icone)?'':mk.icone)}" placeholder="opcional: sem ícone usamos as iniciais"></label></div>
    <div class="fs" style="margin-top:12px"><label>Fundo atrás do logo<select id="mk_fundo">${[['nenhum','Nenhum'],['claro','Claro (logo escuro)'],['escuro','Escuro (logo claro)']].map(([v,t])=>`<option value="${v}" ${mk.fundo===v?'selected':''}>${t}</option>`).join('')}</select></label>
    <label class="chk" style="align-self:end;min-height:44px"><input type="checkbox" id="mk_mostra" ${mk.mostraNome?'checked':''} style="width:20px;height:20px"> Mostrar o nome ao lado do logo</label></div>
  </section></div>
  <section class="panel" style="margin-top:14px"><h2>Prévia</h2><div class="prev-marca"><div class="brand tem-logo-${mk.logo?1:0}">${htmlMarca(mk)}</div><button class="btn pri" type="button" tabindex="-1">Botão principal</button><button class="btn" type="button" tabindex="-1">Botão</button><span class="pill p-acc">Destaque</span><div class="kpi hero" style="min-width:200px"><span class="lb">Recebido</span><span class="v">R$ 12.480,00</span></div></div></section>`};
function mkLe(){const v=id=>$('#'+id)?$('#'+id).value.trim():'';const r=rascMarca;
  r.nome=v('mk_nome')||'Honra';const hx6=v('mk_hex');if(/^#[0-9a-f]{6}$/i.test(hx6))r.cor=hx6.toLowerCase();
  if(!/^data:/.test(r.logo)||v('mk_logo'))r.logo=v('mk_logo');if(!/^data:/.test(r.icone)||v('mk_icone'))r.icone=v('mk_icone');
  r.fundo=$('#mk_fundo').value;r.mostraNome=$('#mk_mostra').checked}
function mkAtualiza(){aplicaMarca(rascMarca);const y=window.scrollY;$('#view').innerHTML=ROUTES.aparencia();AFTER.aparencia();window.scrollTo(0,y)}
function reduzImg(file,cb){const fr=new FileReader();fr.onload=()=>{const src=fr.result;if(/svg/.test(file.type)||file.size<120000)return cb(src);
  const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/png'))};im.onerror=()=>toast('Não consegui ler essa imagem');im.src=src};fr.readAsDataURL(file)}
AFTER.aparencia=()=>{
  ['mk_nome','mk_logo','mk_icone'].forEach(id=>$('#'+id).onchange=()=>{mkLe();mkAtualiza()});
  $('#mk_fundo').onchange=$('#mk_mostra').onchange=()=>{mkLe();mkAtualiza()};
  $('#mk_cor').oninput=e=>{$('#mk_hex').value=e.target.value;rascMarca.cor=e.target.value;aplicaMarca(rascMarca)};
  $('#mk_cor').onchange=()=>{mkLe();mkAtualiza()};
  $('#mk_hex').onchange=()=>{if(!/^#[0-9a-f]{6}$/i.test($('#mk_hex').value.trim())){toast('Use o formato #RRGGBB');return}mkLe();mkAtualiza()};
  document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{mkLe();rascMarca.cor=b.dataset.cor;mkAtualiza()});
  document.querySelectorAll('[data-up]').forEach(inp=>inp.onchange=()=>{const f=inp.files[0];if(!f)return;if(f.size>3e6){toast('Imagem acima de 3 MB');return}
    reduzImg(f,src=>{mkLe();rascMarca[inp.dataset.up]=src;mkAtualiza()})});
};
function miniCal(mes){
  const [y,mo]=mes.split('-').map(Number);const first=new Date(y,mo-1,1);const start=new Date(first);start.setDate(1-first.getDay());
  const dias=new Set(S.agenda.map(a=>a.data));let h='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d);h+=`<a href="#agenda" data-dia="${s}" class="${d.getMonth()!==mo-1?'out':''} ${s===hoje()?'today':''} ${dias.has(s)?'has':''}">${d.getDate()}</a>`}
  return `<h2 style="margin-bottom:10px;text-transform:capitalize">${MESES[mo-1]} de ${y}</h2><div class="cal">${'DSTQQSS'.split('').map(x=>`<b>${x}</b>`).join('')}${h}</div><p class="note" style="margin-top:10px">Dias sublinhados têm compromisso.</p>`;
}

/* ---------- Clientes ---------- */
let filtroArea='todos',busca='';
function tabelaClientes(lista,modo){
  if(!lista.length)return `<div class="empty">${modo==='atraso'?'Nenhum cliente em atraso. Todos os pagamentos estão em dia.':modo==='quitados'?'Nenhum cliente quitou os honorários ainda. Quem quitar todas as parcelas aparece aqui automaticamente.':'Nenhum cliente encontrado.'}</div>`;
  return `<div class="tbl"><table><thead><tr><th>Cliente</th><th>Telefone</th><th>Honorários</th>${modo==='atraso'?'<th class="n">Dias</th><th class="n">Em atraso</th>':'<th class="n">Saldo</th>'}<th>Situação</th><th></th></tr></thead><tbody>
  ${lista.map(c=>{const r=resumoCliente(c);const st=r.quitado?'<span class="pill p-pago">Quitado</span>':r.atras.length?'<span class="pill p-atrasado">Em atraso</span>':c.tipoHon==='exito'?'<span class="pill p-info">Êxito</span>':'<span class="pill p-pendente">Em dia</span>';
    return `<tr><td><a href="#cliente-${c.id}"><strong>${esc(c.nome)}</strong></a><br>${areaTag(c.area)}</td><td>${esc(fmtTel(c.tel))||'—'}</td><td>${c.tipoHon==='exito'?esc(c.exitoPct)+'% no êxito':m(c.total)}</td>${modo==='atraso'?`<td class="n">${r.diasAtraso}</td><td class="n">${m(r.valorAtraso)}</td>`:`<td class="n">${c.tipoHon==='exito'?'—':m(r.saldo)}</td>`}<td>${st}</td><td class="n"><a class="btn sm" href="#cliente-${c.id}">Abrir</a></td></tr>`}).join('')}
  </tbody></table></div>`;
}
ROUTES.clientes=()=>{
  let l=S.clientes.filter(c=>!resumoCliente(c).quitado);
  if(filtroArea!=='todos')l=l.filter(c=>c.area===filtroArea);
  if(busca)l=l.filter(c=>(c.nome+' '+c.cpf+' '+c.tel).toLowerCase().includes(busca.toLowerCase()));
  l.sort((a,b)=>a.nome.localeCompare(b.nome));
  return `${bannerEx()}<div class="phead"><div><h1>Clientes</h1><p>${l.length} cliente(s) em andamento</p></div><a class="btn pri" href="#novo-cliente">Novo cliente</a></div>
  <div class="panel"><div class="row" style="margin-bottom:12px;justify-content:space-between"><div class="chips"><button class="chip ${filtroArea==='todos'?'on':''}" data-area="todos" type="button">Todas as áreas</button>${Object.entries(AREAS).filter(([k])=>S.clientes.some(c=>c.area===k)).map(([k,v])=>`<button class="chip ${filtroArea===k?'on':''}" data-area="${k}" type="button">${v[0]}</button>`).join('')}</div>
  <input id="busca" placeholder="Buscar por nome, CPF ou telefone" style="max-width:280px" value="${esc(busca)}"></div>${tabelaClientes(l)}</div>`;
};
AFTER.clientes=()=>{const b=$('#busca');b.oninput=()=>{busca=b.value;const pos=b.selectionStart;go();const n=$('#busca');n.focus();n.setSelectionRange(pos,pos)}};
ROUTES.atraso=()=>{const l=S.clientes.filter(c=>resumoCliente(c).atras.length).sort((a,b)=>resumoCliente(b).diasAtraso-resumoCliente(a).diasAtraso);
  return `<div class="phead"><div><h1>Clientes em atraso</h1><p>Clientes com parcela vencida e não quitada, do atraso mais antigo ao mais recente.</p></div></div><div class="panel">${tabelaClientes(l,'atraso')}</div>`};
ROUTES.quitados=()=>{const l=S.clientes.filter(c=>resumoCliente(c).quitado);
  return `<div class="phead"><div><h1>Clientes quitados</h1><p>Honorários fixos totalmente pagos.</p></div></div><div class="panel">${tabelaClientes(l,'quitados')}</div>`};
ROUTES.aniversariantes=()=>{
  const mo=hoje().slice(5,7);const l=S.clientes.filter(c=>c.nasc&&c.nasc.slice(5,7)===mo).sort((a,b)=>a.nasc.slice(8).localeCompare(b.nasc.slice(8)));
  return `<div class="phead"><div><h1>Aniversariantes de ${MESES[+mo-1]}</h1><p>${l.length} cliente(s). Um bom momento para um contato.</p></div></div>
  <div class="panel">${l.length?`<div class="list">${l.map(c=>{const idade=+hoje().slice(0,4)-+c.nasc.slice(0,4);const msg=`Olá, ${c.nome.replace(/^Exemplo · /,'').split(' ')[0]}! Passando para desejar um feliz aniversário. Muita saúde e conquistas. ${S.perfil.nome||''}`;return`<div class="li"><div><div class="t"><a href="#cliente-${c.id}">${esc(c.nome)}</a></div><div class="s">Dia ${c.nasc.slice(8)} · faz ${idade} anos · ${esc(fmtTel(c.tel))}</div></div><button class="btn sm" data-copy="${esc(msg)}" type="button">Copiar mensagem</button></div>`}).join('')}</div>`:'<div class="empty">Nenhum aniversariante neste mês.</div>'}</div>`;
};

/* ---------- Formulário de cliente ---------- */

  const v=k=>esc(c[k]??'');
  const temPag=e&&parcelasDe(c.id).some(p=>p.pagamentos.length&&p.num>0);

  <form class="panel" id="fCli" autocomplete="off"><div class="fs">

    <label>Tratamento<select id="c_sexo"><option value="">Não informar</option><option value="f" ${c.sexo==='f'?'selected':''}>Senhora</option><option value="m" ${c.sexo==='m'?'selected':''}>Senhor</option></select></label>
    <label>Nacionalidade<input id="c_nac" value="${v('nac')}"></label>

    <label>Profissão<input id="c_prof" value="${v('prof')}"></label>

    <label>Área *<select id="c_area" required><option value="">Selecione</option>${Object.entries(AREAS).map(([k,x])=>`<option value="${k}" ${c.area===k?'selected':''}>${x[0]}</option>`).join('')}</select></label>
    <div class="sect">Endereço</div>
    <label class="c2">Logradouro<input id="c_end" value="${v('end')}"></label>

    <div class="sect">Honorários</div>
    <label>Modalidade<select id="c_tipo" ${temPag?'disabled':''}><option value="fixo" ${c.tipoHon==='fixo'?'selected':''}>Valor fixo</option><option value="exito" ${c.tipoHon==='exito'?'selected':''}>Por êxito (quota litis)</option></select></label>
    <div class="c4 fs" id="hFixo" style="padding:0">
      <label>Valor total (R$) *<input id="c_total" class="money-in" inputmode="numeric" value="${c.total?fmtCents(c.total):''}" ${temPag?'readonly':''}></label>
      <label>Entrada (R$)<input id="c_entrada" class="money-in" inputmode="numeric" value="${c.entrada?fmtCents(c.entrada):''}" ${temPag?'readonly':''}></label>
      <label>Pagamento<select id="c_forma" ${temPag?'disabled':''}><option value="parcelado" ${c.forma==='parcelado'?'selected':''}>Parcelado</option><option value="vista" ${c.forma==='vista'?'selected':''}>À vista</option></select></label>
      <label id="lN">Nº de parcelas<input id="c_n" type="number" min="1" max="120" value="${c.nParcelas||1}" ${temPag?'readonly':''}></label>

function wireMoney(root){(root||document).querySelectorAll('.money-in').forEach(i=>{if(i.readOnly)return;i.addEventListener('input',()=>{const c=centsFrom(i.value);i.value=c?fmtCents(c):'';i.dispatchEvent(new Event('recalc',{bubbles:true}))})})}
function wireCliente(c){
  wireMoney();
  const upd=()=>{
    const tipo=$('#c_tipo').value;$('#hFixo').hidden=tipo!=='fixo';$('#hExito').hidden=tipo!=='exito';
    const vista=$('#c_forma').value==='vista';$('#lN').hidden=vista;
    const t=centsFrom($('#c_total').value),en=centsFrom($('#c_entrada').value),n=vista?1:Math.max(1,+$('#c_n').value||1);
    const resto=Math.max(0,t-en);const base=Math.floor(resto/n),sobra=resto-base*n;
    $('#c_vp').value=resto?fmtCents(base)+(sobra?` (última ${fmtCents(base+sobra)})`:''):'';
    const v=$('#c_venc').value;
    $('#simul').innerHTML=resto&&v?`${en?`Entrada de ${brl(en)} lançada hoje como paga. `:''}${n} parcela(s) de ${brl(base)}, de ${br(v)} a ${br(addMeses(v,n-1))}.`:(en>t?'<span style="color:var(--bad)">A entrada é maior que o valor total.</span>':'');
    const pct=pctFrom($('#c_pct').value),causa=centsFrom($('#c_causa').value);$('#c_est').value=pct&&causa?fmtCents(Math.round(causa*pct/100)):'';
    const cpf=$('#c_cpf').value;$('#cpfMsg').textContent=onlyDigits(cpf).length===11?(cpfValido(cpf)?'CPF válido':'CPF com dígito inválido'):'';
  };
  $('#fCli').addEventListener('input',upd);$('#fCli').addEventListener('change',upd);$('#fCli').addEventListener('recalc',upd);upd();
  $('#c_cpf').addEventListener('blur',e=>e.target.value=fmtCPF(e.target.value));
  $('#c_tel').addEventListener('blur',e=>e.target.value=fmtTel(e.target.value));
  $('#fCli').onsubmit=ev=>{ev.preventDefault();
    const g=id=>$('#'+id).value.trim();
    const d={nome:g('c_nome'),nasc:g('c_nasc'),tel:onlyDigits(g('c_tel')),cpf:onlyDigits(g('c_cpf')),rg:g('c_rg'),nac:g('c_nac'),sexo:g('c_sexo'),civil:g('c_civil'),prof:g('c_prof'),email:g('c_email'),renda:centsFrom(g('c_renda')),area:g('c_area'),end:g('c_end'),num:g('c_num'),cep:g('c_cep'),bairro:g('c_bairro'),cidade:g('c_cidade'),uf:g('c_uf'),obs:g('c_obs'),causa:centsFrom(g('c_causa'))};
    const tipo=g('c_tipo');
    const plano={tipoHon:tipo,total:centsFrom(g('c_total')),entrada:centsFrom(g('c_entrada')),forma:g('c_forma'),nParcelas:Math.max(1,+g('c_n')||1),primeiroVenc:g('c_venc'),exitoPct:pctFrom(g('c_pct'))};
    if(tipo==='fixo'&&(!plano.total||plano.entrada>plano.total||!plano.primeiroVenc)){toast('Confira valor total, entrada e 1º vencimento');return}
    if(tipo==='exito'&&!plano.exitoPct){toast('Informe o percentual de êxito');return}
    const fazer=()=>{
      if(c){Object.assign(c,d);const travado=parcelasDe(c.id).some(p=>p.pagamentos.length&&p.num>0);
        if(!travado){Object.assign(c,plano);S.parcelas=S.parcelas.filter(p=>p.clienteId!==c.id);gerarParcelasCliente(c)}
        salvar();toast('Alterações salvas');location.hash='#cliente-'+c.id;}
      else{const n=Object.assign({id:nid(),criado:hoje()},d,plano);S.clientes.push(n);gerarParcelasCliente(n);salvar();toast('Cliente cadastrado');location.hash='#cliente-'+n.id}
    };
    if(tipo==='fixo'&&(!c||!parcelasDe(c.id).some(p=>p.pagamentos.length&&p.num>0))&&plano.total>plano.entrada){
      confirmar(`A primeira parcela vence em <strong>${br(plano.primeiroVenc)}</strong>. As demais vencem no mesmo dia dos meses seguintes. Está certo?`,'Sim, salvar',fazer);
    }else fazer();
  };
}
ROUTES['novo-cliente']=()=>formCliente();AFTER['novo-cliente']=()=>wireCliente();
ROUTES['editar-']=id=>{const c=S.clientes.find(x=>x.id===id);return c?formCliente(c):'<div class="empty">Cliente não encontrado.</div>'};
AFTER['editar-']=id=>{const c=S.clientes.find(x=>x.id===id);c&&wireCliente(c)};

/* ---------- Ficha do cliente ---------- */
ROUTES['cliente-']=id=>{
  const c=S.clientes.find(x=>x.id===id);if(!c)return'<div class="empty">Cliente não encontrado.</div>';

/* Impressão limpa de documentos: só a folha, com margens de documento (3 cm em cima e à esquerda, 2 cm embaixo e à direita) */

  document.body.classList.add('imprimindo');const t=document.title;document.title=' ';r.dataset.titulo=t}
function desmontaImpressao(){document.body.classList.remove('imprimindo');const r=$('#printRoot');if(r){if(r.dataset.titulo)document.title=r.dataset.titulo;r.innerHTML=''}}

/* ---------- Google Agenda ---------- */
const TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Sao_Paulo'}catch(e){return'America/Sao_Paulo'}})();
const gcfg=()=>S.google||(S.google={});
const compactDT=(d,h)=>d.replace(/-/g,'')+'T'+(h||'00:00').replace(':','')+'00';
function fimDe(a){const t=new Date(a.data+'T'+(a.hora||'00:00')+':00');t.setHours(t.getHours()+1);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())+'T'+pad(t.getHours())+':'+pad(t.getMinutes())}
function gcalLink(a){
  let datas;if(a.hora){const f=fimDe(a);datas=compactDT(a.data,a.hora)+'/'+compactDT(f.slice(0,10),f.slice(11))}else{datas=a.data.replace(/-/g,'')+'/'+addDias(a.data,1).replace(/-/g,'')}
  const q=new URLSearchParams({action:'TEMPLATE',text:a.titulo,dates:datas,details:a.desc||'',ctz:TZ});
  return 'https://calendar.google.com/calendar/render?'+q.toString()}
function icsEsc(t){return String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function exportaIcs(){
  const l=S.agenda;if(!l.length){toast('A agenda está vazia');return}
  const agora=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const ev=l.map(a=>{const f=a.hora?fimDe(a):null;return['BEGIN:VEVENT','UID:honra-'+a.id+'@honra',
    'DTSTAMP:'+agora,
    a.hora?'DTSTART;TZID='+TZ+':'+compactDT(a.data,a.hora):'DTSTART;VALUE=DATE:'+a.data.replace(/-/g,''),
    a.hora?'DTEND;TZID='+TZ+':'+compactDT(f.slice(0,10),f.slice(11)):'DTEND;VALUE=DATE:'+addDias(a.data,1).replace(/-/g,''),
    'SUMMARY:'+icsEsc(a.titulo),a.desc?'DESCRIPTION:'+icsEsc(a.desc):null,'END:VEVENT'].filter(Boolean).join('\r\n')});
  const txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Honra//Agenda//PT-BR','CALSCALE:GREGORIAN','X-WR-CALNAME:'+icsEsc(marca().nome+' · agenda'),...ev,'END:VCALENDAR'].join('\r\n');
  const b=new Blob([txt],{type:'text/calendar'});const x=document.createElement('a');x.href=URL.createObjectURL(b);x.download=`agenda-${hoje()}.ics`;x.click();
  toast('Arquivo da agenda baixado')}

/* Sincronização nos dois sentidos (precisa do ID de cliente OAuth do Google Cloud) */
let gToken=null,gTokenFim=0,gCliente=null,gOcupado=false,gUltErro='';
const gHash=a=>[a.titulo,a.data,a.hora,a.desc||''].join('|');
function painelGoogle(){const c=gcfg();
  if(!c.clientId)return `<div class="panel g-panel"><div class="g-row"><div><strong>Google Agenda</strong><div class="note">Use "+ Google" em cada compromisso, ou exporte a agenda. Para sincronizar automaticamente nos dois sentidos, configure a conexão.</div></div><button class="btn" data-act="g-config" type="button">Configurar sincronização</button></div></div>`;
  const quando=c.ultima?new Date(c.ultima).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'nunca';
  return `<div class="panel g-panel"><div class="g-row"><div><strong>Google Agenda</strong><div class="note">${c.ligado?`Sincronizando com ${c.conta?esc(c.conta):'sua conta Google'}. Última vez: ${quando}.`:'Conexão configurada. Entre com a conta Google para começar.'}${gUltErro?`<br><span style="color:var(--danger)">${esc(gUltErro)}</span>`:''}</div></div><div class="row"><button class="btn pri" data-act="g-sync" type="button">${gOcupado?'Sincronizando…':c.ligado?'Sincronizar agora':'Entrar com Google'}</button><button class="btn ghost" data-act="g-config" type="button">Ajustes</button>${c.ligado?'<button class="btn ghost" data-act="g-sair" type="button">Desligar</button>':''}</div></div></div>`}
function modalGoogle(){const c=gcfg();
  modal(`<h2>Sincronizar com o Google Agenda</h2><p class="note">Cole o ID de cliente OAuth criado no Google Cloud (termina em <code>.apps.googleusercontent.com</code>). Ele não é senha: só diz ao Google qual aplicativo está pedindo acesso. Cada pessoa entra com a própria conta.</p><form id="fG" class="fs"><label>ID de cliente OAuth<input id="g_id" value="${esc(c.clientId||'')}" placeholder="123456-abc.apps.googleusercontent.com"></label><label>Agenda<select id="g_cal"><option value="primary">Agenda principal da conta</option></select></label><div class="row" style="justify-content:flex-end">${c.clientId?'<button class="btn ghost danger" id="g_rm" type="button">Remover</button>':''}<button class="btn" data-close="1" type="button">Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>`);
  $('#fG').onsubmit=e=>{e.preventDefault();const v=$('#g_id').value.trim();if(v&&!/\.apps\.googleusercontent\.com$/.test(v)){toast('Esse ID não parece um ID de cliente do Google');return}c.clientId=v;c.cal='primary';salvar();fechar();toast(v?'Conexão configurada':'Conexão removida');go()};
  const rm=$('#g_rm');if(rm)rm.onclick=()=>{S.google={};gToken=null;salvar();fechar();toast('Conexão removida');go()}}
function gScript(){return new Promise((ok,erro)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return ok();const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.onload=()=>ok();sc.onerror=()=>erro(new Error('Não foi possível carregar o login do Google'));document.head.appendChild(sc)})}
function gPedeToken(interativo){const c=gcfg();
  if(window.__gMock)return Promise.resolve(window.__gMock.token);
  if(gToken&&Date.now()<gTokenFim)return Promise.resolve(gToken);
  if(!interativo)return Promise.reject(new Error('login'));
  return gScript().then(()=>new Promise((ok,erro)=>{
    gCliente=google.accounts.oauth2.initTokenClient({client_id:c.clientId,scope:'https://www.googleapis.com/auth/calendar.events',
      callback:r=>{if(r.error)return erro(new Error('O Google recusou o acesso ('+r.error+')'));gToken=r.access_token;gTokenFim=Date.now()+(r.expires_in-60)*1000;ok(gToken)},
      error_callback:r=>erro(new Error(r&&r.type==='popup_closed'?'A janela do Google foi fechada':'Não foi possível entrar no Google'))});
    gCliente.requestAccessToken({prompt:c.ligado?'':'consent'})}))}
async function gApi(met,caminho,corpo){
  const url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(gcfg().cal||'primary')+caminho;
  const f=window.__gMock?window.__gMock.fetch:fetch;
  const r=await f(url,{method:met,headers:{Authorization:'Bearer '+gToken,'Content-Type':'application/json'},body:corpo?JSON.stringify(corpo):undefined});
  if(r.status===401){gToken=null;throw new Error('login')}
  if(r.status===404||r.status===410)return null;
  if(!r.ok)throw new Error('O Google respondeu com erro '+r.status);
  return r.status===204?null:r.json()}
function gEvento(a){const corpo={summary:a.titulo,description:a.desc||'',extendedProperties:{private:{honra:'1'}}};
  if(a.hora){const f=fimDe(a);corpo.start={dateTime:a.data+'T'+a.hora+':00',timeZone:TZ};corpo.end={dateTime:f+':00',timeZone:TZ}}
  else{corpo.start={date:a.data};corpo.end={date:addDias(a.data,1)}}return corpo}
function gLocal(g){const st=g.start||{};let data,hora='';
  if(st.dateTime){const t=new Date(st.dateTime);data=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());hora=pad(t.getHours())+':'+pad(t.getMinutes())}else data=st.date;
  return{titulo:g.summary||'(sem título)',desc:g.description||'',data,hora}}
async function gSync(interativo){const c=gcfg();if(!c.clientId||gOcupado)return;
  gOcupado=true;gUltErro='';if(location.hash.startsWith('#agenda'))go();
  try{
    gToken=await gPedeToken(interativo);
    if(!c.conta&&!window.__gMock){try{const u=await (await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList/primary',{headers:{Authorization:'Bearer '+gToken}})).json();c.conta=u.id||''}catch(e){}}
    // 1) apagados aqui
    for(const id of (c.apagar||[]))await gApi('DELETE','/events/'+encodeURIComponent(id));
    c.apagar=[];
    // 2) eventos do Google numa janela de tempo
    const ini=new Date(Date.now()-60*864e5).toISOString(),fim=new Date(Date.now()+400*864e5).toISOString();
    let lista=[],pt='';do{const q=new URLSearchParams({timeMin:ini,timeMax:fim,singleEvents:'true',showDeleted:'true',maxResults:'2500'});if(pt)q.set('pageToken',pt);
      const r=await gApi('GET','/events?'+q);lista=lista.concat((r&&r.items)||[]);pt=r&&r.nextPageToken}while(pt);
    const porId=new Map(lista.map(g=>[g.id,g]));
    let env=0,rec=0;
    for(const a of [...S.agenda]){
      if(!a.gid){if(a.data<ini.slice(0,10))continue;const g=await gApi('POST','/events',gEvento(a));a.gid=g.id;a.gsync=gHash(a);a.gupd=g.updated;env++;continue}
      const g=porId.get(a.gid);const mudouAqui=gHash(a)!==a.gsync;
      if(!g){if(a.data<ini.slice(0,10)||a.data>fim.slice(0,10))continue;
        const x=await gApi('GET','/events/'+encodeURIComponent(a.gid));
        if(x&&x.status!=='cancelled'){porId.set(x.id,x)}else{if(mudouAqui){delete a.gid;const n=await gApi('POST','/events',gEvento(a));a.gid=n.id;a.gsync=gHash(a);a.gupd=n.updated;env++}else{S.agenda=S.agenda.filter(y=>y!==a);rec++}continue}}
      const gg=porId.get(a.gid);
      if(gg.status==='cancelled'){if(mudouAqui){delete a.gid;const n=await gApi('POST','/events',gEvento(a));a.gid=n.id;a.gsync=gHash(a);a.gupd=n.updated;env++}else{S.agenda=S.agenda.filter(y=>y!==a);rec++}continue}
      if(mudouAqui){const n=await gApi('PATCH','/events/'+encodeURIComponent(a.gid),gEvento(a));a.gsync=gHash(a);a.gupd=n&&n.updated;env++}
      else if(gg.updated!==a.gupd){Object.assign(a,gLocal(gg));a.gsync=gHash(a);a.gupd=gg.updated;rec++}
    }
    // 3) novos no Google
    const ligados=new Set(S.agenda.map(a=>a.gid).filter(Boolean));
    for(const g of lista){if(g.status==='cancelled'||ligados.has(g.id)||!g.start)continue;const a=Object.assign({id:nid(),gid:g.id,gupd:g.updated,origem:'google'},gLocal(g));a.gsync=gHash(a);S.agenda.push(a);rec++}
    c.ligado=true;c.ultima=Date.now();salvar();
    if(interativo)toast(env||rec?`Sincronizado: ${env} enviado(s), ${rec} recebido(s)`:'Agenda já estava em dia');
  }catch(e){if(e.message==='login'){if(interativo)gUltErro='Entre de novo com o Google para continuar.'}else{gUltErro=e.message;if(interativo)toast(e.message)}}
  finally{gOcupado=false;if(location.hash.startsWith('#agenda')||location.hash===''||location.hash==='#painel')go()}}
function gAuto(){const c=gcfg();if(c.clientId&&c.ligado&&(gToken||window.__gMock))gSync(false)}
function gSair(){const c=gcfg();if(gToken&&window.google&&google.accounts)try{google.accounts.oauth2.revoke(gToken,()=>{})}catch(e){}gToken=null;c.ligado=false;c.conta='';salvar();toast('Sincronização desligada');go()}

/* ---------- Ações a ajuizar ---------- */
const PRI={alta:['Alta','p-atrasado',0],media:['Média','p-parcial',1],normal:['Normal','p-pendente',2]};
const priPill=p=>`<span class="pill ${PRI[p][1]}">${PRI[p][0]}</span>`;
const DIAS_PARADA=15;
const GL_IC_ALERTA='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>';
const normNome=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const acaoCli=a=>S.clientes.find(c=>c.id===a.clienteId)||(a.clienteId?null:S.clientes.find(c=>normNome(c.nome)===normNome(a.cliente)))||null;
const acoesDoCliente=c=>S.acoes.filter(a=>acaoCli(a)===c);
const diasFila=a=>Math.max(0,Math.round((parseISO(hoje())-parseISO(a.data))/864e5));
const limiteParada=a=>a.prioridade==='alta'?7:DIAS_PARADA;
const parada=a=>a.status==='pendente'&&diasFila(a)>limiteParada(a);
const cliAcaoHtml=a=>{const c=acaoCli(a);return c?`<a href="#cliente-${c.id}">${esc(c.nome)}</a>`:`${esc(a.cliente)} <span class="note" title="Cliente não cadastrado">(sem cadastro)</span>`};
const ordPri=(a,b)=>PRI[a.prioridade][2]-PRI[b.prioridade][2]||a.data.localeCompare(b.data);
let ajTab='pendente';
ROUTES.ajuizar=()=>{const l=S.acoes.filter(a=>a.status===ajTab).sort(ordPri);
  return `<div class="phead"><div><h1>Ações a ajuizar</h1><p>Fila de entrada do escritório, por prioridade e data de chegada.</p></div><button class="btn pri" data-act="nova-acao" type="button">Nova ação</button></div>
  <div class="tabs">${[['pendente','Na fila'],['ajuizada','Ajuizadas']].map(([k,t])=>`<button class="tab ${ajTab===k?'on':''}" data-aj="${k}" type="button">${t} (${S.acoes.filter(a=>a.status===k).length})</button>`).join('')}</div>
  <div class="panel">${l.length?`<div class="tbl"><table><thead><tr><th>Prioridade</th><th>Cliente</th><th>Tipo</th>${ajTab==='pendente'?'<th>Descrição</th><th>Entrada</th><th class="n">Na fila</th>':'<th>Processo</th><th>Vara / comarca</th><th>Ajuizada em</th>'}<th></th></tr></thead><tbody>${l.map(a=>`<tr><td data-label="Prioridade">${priPill(a.prioridade)}</td><td data-label="Cliente">${cliAcaoHtml(a)}</td><td data-label="Tipo"><strong>${esc(a.tipo)}</strong></td>${ajTab==='pendente'?`<td data-label="Descrição">${esc(a.desc)||'—'}</td><td data-label="Entrada">${br(a.data)}</td><td class="n" data-label="Na fila">${parada(a)?`<span class="pill p-atrasado" title="Parada há mais de ${limiteParada(a)} dias">${diasFila(a)} d</span>`:diasFila(a)+' d'}</td>`:`<td data-label="Processo">${esc(a.processo)||'—'}</td><td data-label="Vara">${esc(a.vara)||'—'}</td><td data-label="Ajuizada em">${a.dataAjuiz?br(a.dataAjuiz):'—'}</td>`}<td class="n"><div class="row" style="justify-content:flex-end;gap:6px">${a.status==='pendente'?`<button class="btn sm pri" data-act="ajuizou" data-id="${a.id}" type="button">Ajuizou</button>`:`<button class="btn sm" data-act="voltar-fila" data-id="${a.id}" type="button">Voltar à fila</button>`}<button class="btn sm" data-act="edit-acao" data-id="${a.id}" type="button">Editar</button><button class="btn sm ghost danger ico-btn" data-act="del-acao" data-id="${a.id}" type="button" title="Excluir" aria-label="Excluir">✕</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nada aqui. Use "Nova ação" para registrar.</div>'}</div>`;

function pagamentosNoMes(mes){const out=[];S.parcelas.forEach(p=>p.pagamentos.forEach(g=>{if(ym(g.data)===mes)out.push({p,g})}));return out}
function kpisMes(mes){
  const h=hoje();
  const recebido=pagamentosNoMes(mes).reduce((a,x)=>a+x.g.valor,0)+S.avulsos.filter(a=>ym(a.data)===mes).reduce((a,b)=>a+b.valor,0);
  const aReceber=S.parcelas.filter(p=>ym(p.venc)===mes).reduce((a,p)=>a+Math.max(0,p.valor-pagoDe(p)),0);
  const atraso=S.parcelas.filter(p=>p.venc<h).reduce((a,p)=>a+Math.max(0,p.valor-pagoDe(p)),0);
  const v30=S.parcelas.filter(p=>p.venc>=h&&p.venc<=addDias(h,30)).reduce((a,p)=>a+Math.max(0,p.valor-pagoDe(p)),0);
  return{recebido,aReceber,atraso,v30};
}

  else if(finTab==='parcelas'){const h=hoje(),q=normNome(finBusca);

  else if(finTab==='exito'){const l=S.clientes.filter(c=>c.tipoHon==='exito');corpo=`<div class="panel">${l.length?`<div class="tbl"><table><thead><tr><th>Cliente</th><th>Área</th><th class="n">Percentual</th><th class="n">Causa estimada</th><th class="n">Honorário estimado</th></tr></thead><tbody>${l.map(c=>`<tr><td><a href="#cliente-${c.id}">${esc(c.nome)}</a></td><td>${areaTag(c.area)}</td><td class="n">${esc(c.exitoPct)}%</td><td class="n">${c.causa?m(c.causa):'—'}</td><td class="n">${c.causa?m(Math.round(c.causa*c.exitoPct/100)):'—'}</td></tr>`).join('')}</tbody></table></div><p class="note">Potencial total estimado: ${m(l.reduce((a,c)=>a+Math.round((c.causa||0)*c.exitoPct/100),0))}</p>`:'<div class="empty">Nenhum contrato por êxito.</div>'}</div>`}
  return `<div class="phead"><div><h1>Financeiro</h1><p>Recebimentos de honorários do escritório.</p></div><div class="row"><button class="btn" data-act="mes" data-d="-1" type="button" aria-label="Mês anterior">‹</button><strong style="min-width:130px;text-align:center;text-transform:capitalize">${MESES[mo-1]} ${y}</strong><button class="btn" data-act="mes" data-d="1" type="button" aria-label="Próximo mês">›</button><button class="btn" data-act="avulso" type="button">Recebimento avulso</button></div></div>
  <div class="kpis"><div class="kpi ok"><span class="lb">Recebido no mês</span><span class="v">${m(k.recebido)}</span></div><div class="kpi"><span class="lb">A receber no mês</span><span class="v">${m(k.aReceber)}</span><span class="s">em aberto com vencimento no mês</span></div><div class="kpi bad"><span class="lb">Em atraso (hoje)</span><span class="v">${m(k.atraso)}</span><span class="s">vencido e não pago</span></div><div class="kpi"><span class="lb">A vencer em 30 dias</span><span class="v">${m(k.v30)}</span></div></div>
  <div class="tabs">${[['geral','Visão geral'],['parcelas','Parcelas'],['receber','A receber'],['recebidos','Recebidos'],['inad','Inadimplência'],['exito','Contratos por êxito']].map(([a,t])=>`<button class="tab ${finTab===a?'on':''}" data-fin="${a}" type="button">${t}</button>`).join('')}</div>${corpo}`;
};

function tabParcSit(l,vazio){const tot=l.reduce((a,p)=>a+p.valor,0),ab=l.reduce((a,p)=>a+Math.max(0,p.valor-pagoDe(p)),0);
  return `<div class="panel">${l.length?`<div class="tbl"><table><thead><tr><th>Cliente</th><th>Parcela</th><th>Vencimento</th><th class="n">Valor</th><th class="n">Em aberto</th><th>Situação</th><th></th></tr></thead><tbody>${l.map(p=>{const st=situacao(p),dd=diasAte(p.venc);return`<tr><td data-label="Cliente">${cliNome(p.clienteId)}</td><td data-label="Parcela">${p.num===0?'Entrada':p.num}</td><td data-label="Vencimento">${br(p.venc)}${st!=='pago'&&dd>=0&&dd<=30?`<div class="note">${dd===0?'hoje':dd===1?'amanhã':'em '+dd+' dias'}</div>`:''}</td><td class="n" data-label="Valor">${m(p.valor)}</td><td class="n" data-label="Em aberto">${m(Math.max(0,p.valor-pagoDe(p)))}</td><td data-label="Situação">${pill(st)}</td><td class="n">${st!=='pago'?`<button class="btn sm pri" data-act="baixa" data-id="${p.id}" type="button">Dar baixa</button>`:p.pagamentos.length?`<button class="btn sm" data-act="recibo" data-id="${p.id}" type="button">Recibo</button>`:''}</td></tr>`}).join('')}</tbody></table></div><p class="note">${l.length} parcela(s) · total ${m(tot)} · em aberto ${m(ab)}</p>`:`<div class="empty">${vazio}</div>`}</div>`}
function tabParc(l,vazio,dias){return `<div class="panel">${l.length?`<div class="tbl"><table><thead><tr><th>Cliente</th><th>Parcela</th><th>Vencimento</th>${dias?'<th class="n">Dias</th>':''}<th class="n">Em aberto</th><th>Situação</th><th></th></tr></thead><tbody>${l.map(p=>`<tr><td>${cliNome(p.clienteId)}</td><td>${p.num===0?'Entrada':p.num}</td><td>${br(p.venc)}</td>${dias?`<td class="n">${Math.round((parseISO(hoje())-parseISO(p.venc))/864e5)}</td>`:''}<td class="n">${m(p.valor-pagoDe(p))}</td><td>${pill(situacao(p))}</td><td class="n"><button class="btn sm pri" data-act="baixa" data-id="${p.id}" type="button">Dar baixa</button></td></tr>`).join('')}</tbody></table></div><p class="note">Total: ${m(l.reduce((a,p)=>a+p.valor-pagoDe(p),0))}</p>`:`<div class="empty">${vazio}</div>`}</div>`}
function graf6(mes){
  const ms=[];for(let i=5;i>=0;i--)ms.push(ym(addMeses(mes+'-01',-i)));
  const d=ms.map(x=>({x,r:pagamentosNoMes(x).reduce((a,b)=>a+b.g.valor,0)+S.avulsos.filter(a=>ym(a.data)===x).reduce((a,b)=>a+b.valor,0),p:S.parcelas.filter(p=>ym(p.venc)===x).reduce((a,p)=>a+p.valor,0)}));
  const max=Math.max(1,...d.flatMap(v=>[v.r,v.p]));const nice=niceMax(max);
  const W=640,H=240,L=64,B=28,T=10,cw=(W-L-10)/6,bw=Math.min(26,cw/3);
  const yv=v=>T+(H-T-B)*(1-v/nice);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recebido e previsto por mês">`;
  for(let i=0;i<=4;i++){const v=nice*i/4;s+=`<line x1="${L}" x2="${W-10}" y1="${yv(v)}" y2="${yv(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${yv(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" class="money">${v>=100000?Math.round(v/100000)+' mil':Math.round(v/100)}</text>`}
  d.forEach((v,i)=>{const cx=L+cw*i+cw/2;
    s+=`<rect x="${cx-bw-2}" y="${yv(v.p)}" width="${bw}" height="${H-B-yv(v.p)}" fill="var(--line)" rx="2"><title>Previsto ${brl(v.p)}</title></rect><rect x="${cx+2}" y="${yv(v.r)}" width="${bw}" height="${H-B-yv(v.r)}" fill="var(--accent)" rx="2"><title>Recebido ${brl(v.r)}</title></rect><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${v.x===mes?'var(--fg)':'var(--muted)'}" font-weight="${v.x===mes?700:400}">${MESES[+v.x.slice(5)-1].slice(0,3)}</text>`});
  return s+'</svg><p class="note">Previsto = soma das parcelas que vencem no mês. Recebido = baixas e avulsos com data no mês. Eixo em R$.</p>';
}
function niceMax(v){const c=v;const e=Math.pow(10,Math.floor(Math.log10(c)));for(const f of[1,2,2.5,5,10])if(f*e>=c)return f*e;return 10*e}

    case 'nuvem-entrar':nuvemEntrar();break;
    case 'gate-modo':gateModo=ds.modo;nuvemMsg='';renderGate();break;
    case 'gate-esqueci':nuvemEsqueci();break;
    case 'gate-olho':{const i=$('#'+ds.alvo);if(i){const v=i.type==='password';i.type=v?'text':'password';el.setAttribute('aria-label',v?'Ocultar senha':'Mostrar senha')}break}
    case 'nuvem-sair':nuvemSair();break;
    case 'legal':abrirLegal(ds.tipo);break;
    case 'legal-fechar':fecharLegal();break;
    case 'mfa-ativar':mfaAtivar();break;
    case 'mfa-desativar':mfaDesativar(ds.fator);break;
    case 'excluir-conta':excluirConta();break;
    case 'nuvem-sincar':nuvemSincronizar(true);break;
    case 'exp-ics':exportaIcs();break;
    case 'g-config':modalGoogle();break;
    case 'g-sync':gSync(true);break;
    case 'g-sair':gSair();break;
    case 'nova-acao':modalAcao();break;
    case 'edit-acao':modalAcao(S.acoes.find(x=>x.id===id));break;
    case 'del-acao':confirmar('Excluir esta ação da fila?','Excluir',()=>{S.acoes=S.acoes.filter(x=>x.id!==id);salvar();go()});break;
    case 'ajuizou':modalAjuizou(S.acoes.find(x=>x.id===id));break;
    case 'nova-acao-cli':modalAcao(null,S.clientes.find(x=>x.id===id));break;
    case 'voltar-fila':S.acoes.find(x=>x.id===id).status='pendente';salvar();go();break;
    case 'mes':finMes=ym(addMeses(finMes+'-01',+ds.d));go();break;
    case 'del-avulso':S.avulsos=S.avulsos.filter(x=>x.id!==id);salvar();go();break;
    case 'nova-empresa':modalEmpresa();break;
    case 'edit-empresa':modalEmpresa(S.empresas.find(x=>x.id===id));break;
    case 'novo-devedor':modalDevedor();break;
    case 'edit-devedor':modalDevedor(S.devedores.find(x=>x.id===id));break;
    case 'novo-acordo':modalAcordo();break;
    case 'baixa-acordo':{const ac=S.acordos.find(x=>x.id===+ds.a);modalBaixa(ac.parcelas.find(p=>p.id===id),go);break}
    case 'copiar-rel':{const d=relDados();copiar([d.cols,...d.rows].map(r=>r.join('\t')).join('\n'));break}
    case 'copiar-backup':copiar(JSON.stringify(S));break;
    case 'baixar-backup':{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=`honra-dados-${hoje()}.json`;l.click();break}
    case 'restaurar':try{const d=JSON.parse($('#bk_in').value);if(!d.clientes)throw 0;confirmar('Substituir todos os dados atuais por este backup?','Restaurar',()=>{S=Object.assign(vazio(),d);salvar();toast('Backup restaurado');location.hash='#painel'})}catch(_){toast('Backup inválido: cole o texto completo exportado')}break;
    case 'zerar':confirmar('Apagar todos os dados deste navegador? Faça um backup antes.','Apagar tudo',()=>{S=vazio();salvar();toast('Dados apagados');location.hash='#painel'});break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});

carregar();aplicaMarca();go();if(nuvemDisponivel()){document.body.classList.add('trancado');renderGate();try{if(Object.keys(localStorage).some(k=>/^sb-.*-auth-token$/.test(k)))carregaMostra()}catch(e){}}
nuvemIniciar();
// app instalável: só registra quando servido por https (GitHub Pages), não dentro do visualizador
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&standalone&&!/claude\.ai|claudeusercontent/.test(location.host))navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
